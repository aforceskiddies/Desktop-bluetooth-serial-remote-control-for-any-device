<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorpion Arm Remote</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    user-select: none;
    gap: 24px;
    padding: 20px;
  }

  .layout {
    display: flex;
    align-items: center;
    gap: 40px;
  }

  /* ── D-pad ── */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 68px);
    grid-template-rows: repeat(3, 68px);
    gap: 6px;
  }
  .dpad button {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 2px solid #444;
    background: #222;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, transform 0.1s, border-color 0.1s;
  }
  .dpad button:hover { border-color: #0af; }
  .dpad button:active, .dpad button.pressed {
    background: #0af; border-color: #0af; transform: scale(0.92);
  }
  .dpad .empty { background: transparent; pointer-events: none; }

  /* ── Card ── */
  .card {
    background: linear-gradient(160deg, #16213e 0%, #0f3460 100%);
    border: 1px solid #0af3;
    border-radius: 20px;
    padding: 24px 28px 20px;
    width: 270px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 0 32px #0af2, 0 4px 24px rgba(0,0,0,0.5);
  }
  .card h1 { font-size: 18px; font-weight: 700; color: #e0f7ff; letter-spacing: 0.5px; }

  /* ── Robot arm SVG logo ── */
  .logo-wrap { width: 130px; height: 130px; }

  .conn-label {
    font-size: 12px;
    color: #7ecfff;
    text-align: center;
    min-height: 16px;
  }
  .conn-label.ok { color: #4caf50; }

  .status-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 26px;
    color: #aaa;
    padding: 4px;
    transition: color 0.15s;
    display: flex; align-items: center;
  }
  .icon-btn:hover { color: #0af; }
  .bt-svg { color: #1e88e5; transition: color 0.2s; }
  .bt-svg.connected { color: #4caf50; }

  /* ── CODE buttons (diamond: C top, O left, E right, D bottom) ── */
  .code-pad {
    display: grid;
    grid-template-columns: repeat(3, 68px);
    grid-template-rows: repeat(3, 68px);
    gap: 6px;
  }
  .code-pad button {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 2px solid #444;
    background: #222;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s, border-color 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .code-pad button:hover { border-color: #f60; }
  .code-pad button:active, .code-pad button.pressed {
    background: #f60; border-color: #f60; transform: scale(0.92);
  }
  .code-pad .empty { background: transparent; pointer-events: none; }

  /* ── Info modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1a1a2e;
    border: 1px solid #0af4;
    border-radius: 12px;
    width: 320px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,180,255,0.15);
    color: #e0f7ff;
  }
  .modal-header {
    background: #e53935;
    color: #fff;
    padding: 14px 20px;
    font-size: 17px;
    font-weight: 600;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
  }
  .modal table { width: 100%; border-collapse: collapse; }
  .modal th { background: #0f3460; color: #7ecfff; padding: 8px 12px; font-size: 13px; }
  .modal td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #ffffff15; font-size: 15px; }
  .modal td:first-child { text-align: left; }
  .btn-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    background: #333; color: #fff;
    border-radius: 50%;
    font-weight: 700; font-size: 14px;
    border: 1px solid #555;
  }

  /* ── Scan modal ── */
  .scan-modal {
    background: #1a1a2e;
    border: 1px solid #0af4;
    border-radius: 12px;
    width: 340px;
    overflow: hidden;
    color: #e0f7ff;
    box-shadow: 0 8px 32px rgba(0,180,255,0.2);
  }
  .scan-modal-header {
    background: #0f3460;
    color: #7ecfff;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #0af3;
  }
  #port-list { list-style: none; max-height: 200px; overflow-y: auto; }
  #port-list li {
    padding: 12px 20px;
    cursor: pointer;
    border-bottom: 1px solid #ffffff10;
    font-size: 14px;
    color: #aaa;
  }
  #port-list li:hover { background: #0f3460; color: #fff; }
  .scan-footer { padding: 12px 20px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn-secondary {
    padding: 8px 18px; border: 1px solid #555; background: transparent;
    border-radius: 6px; cursor: pointer; font-size: 13px; color: #aaa;
  }
  .btn-secondary:hover { border-color: #aaa; color: #fff; }
  .btn-primary {
    padding: 8px 18px; background: #1e88e5; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .btn-primary:hover { background: #1565c0; }

  /* ── Serial log ── */
  .serial-log-wrap {
    width: 100%;
    max-width: 780px;
  }
  .serial-log-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #0f3460;
    border-radius: 10px 10px 0 0;
    padding: 8px 14px;
    border: 1px solid #0af3;
    border-bottom: none;
  }
  .serial-log-header span { color: #7ecfff; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
  .serial-log-header button {
    background: none; border: none; color: #7ecfff; cursor: pointer; font-size: 12px;
    padding: 2px 8px; border: 1px solid #0af4; border-radius: 4px;
  }
  .serial-log-header button:hover { background: #0af2; }
  #serial-log {
    background: #0d0d1a;
    border: 1px solid #0af3;
    border-radius: 0 0 10px 10px;
    padding: 10px 14px;
    height: 130px;
    overflow-y: auto;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    color: #4caf50;
    line-height: 1.6;
  }
  #serial-log .ts { color: #555; margin-right: 6px; }
  #serial-log .sent { color: #0af; }
  #serial-log .info { color: #ffb300; }
  #serial-log .err  { color: #ef5350; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #0f3460; color: #7ecfff; padding: 10px 22px;
    border-radius: 8px; font-size: 13px; opacity: 0;
    border: 1px solid #0af4;
    transition: opacity 0.3s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="layout">
  <!-- D-pad -->
  <div class="dpad">
    <div class="empty"></div>
    <button id="btn-up" title="Forward (F / S)">&#8593;</button>
    <div class="empty"></div>
    <button id="btn-left" title="Left (L / S)">&#8592;</button>
    <div class="empty"></div>
    <button id="btn-right" title="Right (R / S)">&#8594;</button>
    <div class="empty"></div>
    <button id="btn-down" title="Back (B / S)">&#8595;</button>
    <div class="empty"></div>
  </div>

  <!-- Card -->
  <div class="card">
    <h1>Scorpion Arm Remote</h1>

    <!-- Inline SVG robot arm illustration -->
    <svg class="logo-wrap" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
      <!-- base platform -->
      <ellipse cx="65" cy="118" rx="38" ry="8" fill="#1565c0" opacity="0.7"/>
      <rect x="40" y="105" width="50" height="14" rx="5" fill="#1565c0"/>
      <!-- suction cups -->
      <circle cx="48" cy="120" r="5" fill="#0d47a1"/>
      <circle cx="65" cy="122" r="5" fill="#0d47a1"/>
      <circle cx="82" cy="120" r="5" fill="#0d47a1"/>
      <!-- base rotation ring -->
      <ellipse cx="65" cy="100" rx="22" ry="8" fill="#1976d2"/>
      <rect x="58" y="88" width="14" height="16" rx="3" fill="#1976d2"/>
      <!-- lower arm -->
      <rect x="61" y="58" width="14" height="35" rx="5" fill="#1e88e5" transform="rotate(-15 65 90)"/>
      <!-- upper arm -->
      <rect x="59" y="30" width="12" height="32" rx="5" fill="#42a5f5" transform="rotate(10 65 60)"/>
      <!-- wrist joint -->
      <circle cx="72" cy="38" r="7" fill="#0d47a1"/>
      <!-- gripper mount -->
      <rect x="68" y="22" width="18" height="8" rx="3" fill="#263238" transform="rotate(20 75 26)"/>
      <!-- gripper left claw -->
      <path d="M78 20 Q90 12 96 20 Q90 22 83 24 Z" fill="#37474f"/>
      <!-- gripper right claw -->
      <path d="M78 26 Q90 34 96 26 Q90 24 83 24 Z" fill="#263238"/>
      <!-- joint circles -->
      <circle cx="65" cy="90" r="6" fill="#0d47a1" stroke="#7ecfff" stroke-width="1.5"/>
      <circle cx="67" cy="62" r="5" fill="#0d47a1" stroke="#7ecfff" stroke-width="1.5"/>
      <!-- highlight screws -->
      <circle cx="65" cy="90" r="2" fill="#7ecfff" opacity="0.6"/>
      <circle cx="67" cy="62" r="2" fill="#7ecfff" opacity="0.6"/>
      <!-- blue LED on base -->
      <circle cx="65" cy="100" r="3" fill="#00e5ff" opacity="0.9"/>
    </svg>

    <div class="conn-label" id="conn-label">Not connected</div>

    <div class="status-bar">
      <button class="icon-btn" id="info-btn" title="Command reference">&#9432;</button>
      <button class="icon-btn" id="bt-btn" title="Connect serial port">
        <svg class="bt-svg" id="bt-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
        </svg>
      </button>
      <button class="icon-btn" id="disconnect-btn" title="Disconnect" style="font-size:22px;">&#9587;</button>
    </div>
  </div>

  <!-- CODE pad: diamond layout — C top, O left, E right, D bottom -->
  <div class="code-pad">
    <div class="empty"></div>
    <button id="btn-C" title="C / c">C</button>
    <div class="empty"></div>
    <button id="btn-O" title="O / o">O</button>
    <div class="empty"></div>
    <button id="btn-E" title="E / e">E</button>
    <div class="empty"></div>
    <button id="btn-D" title="D / d">D</button>
    <div class="empty"></div>
  </div>
</div>

<!-- Serial log -->
<div class="serial-log-wrap">
  <div class="serial-log-header">
    <span>&#9654; SERIAL MONITOR — 9600 baud</span>
    <button id="clear-log">Clear</button>
  </div>
  <div id="serial-log"><span class="info">— serial log ready —</span></div>
</div>

<!-- Info modal -->
<div class="modal-overlay" id="info-modal">
  <div class="modal">
    <div class="modal-header" id="info-close">&#8592; Command Reference</div>
    <table>
      <thead><tr><th>Button</th><th>Press</th><th>Release</th></tr></thead>
      <tbody>
        <tr><td><span class="btn-circle">&#8593;</span></td><td>F</td><td>S</td></tr>
        <tr><td><span class="btn-circle">&#8595;</span></td><td>B</td><td>S</td></tr>
        <tr><td><span class="btn-circle">&#8592;</span></td><td>L</td><td>S</td></tr>
        <tr><td><span class="btn-circle">&#8594;</span></td><td>R</td><td>S</td></tr>
        <tr><td><span class="btn-circle">C</span></td><td>C</td><td>c</td></tr>
        <tr><td><span class="btn-circle">O</span></td><td>O</td><td>o</td></tr>
        <tr><td><span class="btn-circle">D</span></td><td>D</td><td>d</td></tr>
        <tr><td><span class="btn-circle">E</span></td><td>E</td><td>e</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Serial port modal -->
<div class="modal-overlay" id="scan-modal">
  <div class="scan-modal">
    <div class="scan-modal-header">
      <span>Select Serial / Bluetooth Port</span>
      <button class="icon-btn" id="scan-close" style="color:#7ecfff;font-size:18px;">&#10005;</button>
    </div>
    <ul id="port-list"><li style="padding:20px;color:#555;">Click "Request Port" — browser will show available serial ports.</li></ul>
    <div class="scan-footer">
      <button class="btn-secondary" id="scan-close2">Cancel</button>
      <button class="btn-primary" id="request-port-btn">Request Port</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let port = null;
  let writer = null;

  const connLabel = document.getElementById('conn-label');
  const btIcon    = document.getElementById('bt-icon');
  const logEl     = document.getElementById('serial-log');

  // ── Log ──
  function logLine(text, cls = 'sent') {
    const now = new Date();
    const ts  = now.toTimeString().slice(0,8);
    const line = document.createElement('div');
    line.innerHTML = `<span class="ts">[${ts}]</span><span class="${cls}">${text}</span>`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function toast(msg, dur = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur);
  }

  // ── Send ──
  async function sendChar(ch, label) {
    if (!writer) { toast('Not connected — click the Bluetooth icon'); return; }
    try {
      await writer.write(new TextEncoder().encode(ch));
      logLine(`TX → "${ch}"  (${label})`, 'sent');
    } catch(e) {
      logLine(`Error: ${e.message}`, 'err');
      toast('Send error: ' + e.message);
    }
  }

  // ── Serial connect ──
  async function connectSerial() {
    if (!('serial' in navigator)) {
      toast('Web Serial not supported — use Chrome or Edge');
      logLine('Web Serial API not available in this browser.', 'err');
      return;
    }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      writer = port.writable.getWriter();
      connLabel.textContent = 'Connected ✓';
      connLabel.classList.add('ok');
      btIcon.classList.add('connected');
      logLine('Port opened — 9600 baud, 8N1', 'info');
      toast('Connected at 9600 baud');
      document.getElementById('scan-modal').classList.remove('open');
    } catch(e) {
      if (e.name !== 'NotFoundError') {
        logLine(`Connect failed: ${e.message}`, 'err');
        toast('Connection failed: ' + e.message);
      }
    }
  }

  async function disconnect() {
    try {
      if (writer) { writer.releaseLock(); writer = null; }
      if (port)   { await port.close(); port = null; }
    } catch(_) {}
    connLabel.textContent = 'Not connected';
    connLabel.classList.remove('ok');
    btIcon.classList.remove('connected');
    logLine('Port closed.', 'info');
    toast('Disconnected');
  }

  // ── Button map ──
  const btns = {
    'btn-up':    { press: 'F', release: 'S', label: 'Forward' },
    'btn-down':  { press: 'B', release: 'S', label: 'Back' },
    'btn-left':  { press: 'L', release: 'S', label: 'Left' },
    'btn-right': { press: 'R', release: 'S', label: 'Right' },
    'btn-C':     { press: 'C', release: 'c', label: 'C' },
    'btn-O':     { press: 'O', release: 'o', label: 'O' },
    'btn-D':     { press: 'D', release: 'd', label: 'D' },
    'btn-E':     { press: 'E', release: 'e', label: 'E' },
  };

  Object.entries(btns).forEach(([id, cmd]) => {
    const el = document.getElementById(id);
    if (!el) return;

    const onPress   = () => { el.classList.add('pressed');    sendChar(cmd.press,   cmd.label + ' press'); };
    const onRelease = () => { el.classList.remove('pressed'); sendChar(cmd.release, cmd.label + ' release'); };

    el.addEventListener('mousedown',  onPress);
    el.addEventListener('mouseup',    onRelease);
    el.addEventListener('mouseleave', () => { if (el.classList.contains('pressed')) onRelease(); });
    el.addEventListener('touchstart', e => { e.preventDefault(); onPress(); });
    el.addEventListener('touchend',   e => { e.preventDefault(); onRelease(); });
  });

  // keyboard
  const keyMap = {
    'ArrowUp':'btn-up','ArrowDown':'btn-down','ArrowLeft':'btn-left','ArrowRight':'btn-right',
    'c':'btn-C','C':'btn-C','o':'btn-O','O':'btn-O','d':'btn-D','D':'btn-D','e':'btn-E','E':'btn-E',
  };
  const held = new Set();
  document.addEventListener('keydown', ev => {
    const id = keyMap[ev.key];
    if (!id || held.has(id)) return;
    held.add(id);
    document.getElementById(id)?.dispatchEvent(new Event('mousedown'));
  });
  document.addEventListener('keyup', ev => {
    const id = keyMap[ev.key];
    if (!id) return;
    held.delete(id);
    document.getElementById(id)?.dispatchEvent(new Event('mouseup'));
  });

  // ── UI wiring ──
  document.getElementById('bt-btn').addEventListener('click', () => document.getElementById('scan-modal').classList.add('open'));
  document.getElementById('request-port-btn').addEventListener('click', connectSerial);
  document.getElementById('disconnect-btn').addEventListener('click', disconnect);
  document.getElementById('scan-close').addEventListener('click',  () => document.getElementById('scan-modal').classList.remove('open'));
  document.getElementById('scan-close2').addEventListener('click', () => document.getElementById('scan-modal').classList.remove('open'));
  document.getElementById('info-btn').addEventListener('click',   () => document.getElementById('info-modal').classList.add('open'));
  document.getElementById('info-close').addEventListener('click', () => document.getElementById('info-modal').classList.remove('open'));
  document.getElementById('info-modal').addEventListener('click', e => { if (e.target===e.currentTarget) e.currentTarget.classList.remove('open'); });
  document.getElementById('scan-modal').addEventListener('click', e => { if (e.target===e.currentTarget) e.currentTarget.classList.remove('open'); });
  document.getElementById('clear-log').addEventListener('click', () => { logEl.innerHTML = '<span class="info">— cleared —</span>'; });
</script>
</body>
</html>
